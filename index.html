<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>國立科技高中─校園社團介紹網</title>
    <style>
        #main {
            width: 1024px;
            height: 768px;
            margin: auto;
            /* background: lightblue; */
        }

        #top {
            width: 1000px;
            height: 65px;
            margin: auto;
            /* 置中 */
            /* background-color: lightcoral; */
        }

        #left {
            width: 215px;
            /* calc可以直接做計算！   +、-、*、/左右要有空白 */
            height: calc(768px - 65px - 20px);
            float: left;
            margin-left: 12px;
            /* background-color: azure; */
        }

        #menu {
            width: 215px;
            height: calc(768px - 65px - 20px - 25px);
            /* background-color: bisque; */
        }

        #menu div {
            font-size: 24px;
            font-family: "標楷體";
            font-weight: 500;
            text-decoration: underline;
            text-align: center;
        }

        #menu td {
            width: 215px;
            /* 也可以35，根據menu1.png的高度，設定40px版比較好看 */
            height: 40px;
            text-align: center;
            font-family: "標楷體";
            font-size: 16px;
            color: #000;
            background: url("./images/menu1.png")no-repeat center;
        }

        #menu td:hover {
            background: url("./images/menu2.png")no-repeat center;
        }

        #update {
            width: 215px;
            height: 25px;
            /* background-color: brown; */
            font-family: "標楷體";
            font-size: 16px;
            color: #000;
            text-align: center;
        }

        #right {
            height: calc(768px - 65px - 20px);
            width: 770px;
            float: right;
            margin-right: 12px;
            /* background-color: beige; */
        }

        marquee {
            height: 29px;
            width: 770px;
            /* background-color: lightgreen; */

            /* 考試可以不寫這個(此區會往下掉一點) */
            vertical-align: middle;
            color: #00f;
            font-family: "標楷體";
            font-size: 24px;
        }

        iframe {
            height: calc(768px - 65px - 29px - 20px);
            width: 770px;
            /* background-color: lightgrey; */
        }

        #footer {
            width: 1000px;
            height: 20px;
            margin: auto;
            clear: both;
            /* background-color: lightseagreen; */
            font-family: "標楷體";
            font-size: 16px;
            color: #000;
            text-align: center;
        }
    </style>

</head>

<body>

    <div id="main">
        <div id="top">
            <a href="./index.html"><img src="./images/logo.png" alt="國立科技高中校園社團介紹網" title="國立科技高中校園社團介紹網"></a>
        </div>

        <div id="left">
            <div id="menu">
                <div>社團介紹</div>
                <!-- table>tr*6>td -->
                <table>
                    <tr>
                        <td><a href="./guitar_history.html" target="iframe">吉他社</a></td>
                    </tr>
                    <tr>
                        <td>熱舞社</td>
                    </tr>
                    <tr>
                        <td>棒球社</td>
                    </tr>
                    <tr>
                        <td>羽球社</td>
                    </tr>
                    <tr>
                        <td>足球社</td>
                    </tr>
                    <tr>
                        <td>童軍社</td>
                    </tr>
                </table>
            </div>

            <div id="update">最近更新日期：2026/11/27</div>
        </div>

        <div id="right">
            <marquee>歡迎光臨校園社團介紹網，參觀後請支持社團活
                動並熱烈參與</marquee>
            <!-- iframe = content (文字可照題目打也可自訂) -->
            <iframe src="./main.html" frameborder="0" name="iframe"></iframe>
        </div>

        <div id="footer">網頁設計及維護</div>

    </div>

</body>

</html>
